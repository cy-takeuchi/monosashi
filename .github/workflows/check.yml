name: Check

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # PR で回すのはここだけ。実 kintone には接続しない。
  # 高速・常時グリーンを維持することが、テストがコメントアウトされないための条件。
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # **ここでステップを並べない。** 並べると、手元で「CI と同じもの」を
      # 回すのに毎回この YAML を読むことになり、片方だけ更新されても
      # 誰も気づかない。定義は package.json の check ひとつに置く。
      #
      # 中身は biome / tsc / test / probe:build / pack:check。
      # pack:check は build も兼ねる（tarball を作る前にビルドする）。
      - name: すべての検査
        run: pnpm run check
