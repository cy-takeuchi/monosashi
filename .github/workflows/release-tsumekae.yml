name: Release tsumekae

# ============================================================================
# **このファイルは 0.1.0 の初回公開のための一時的な状態です。**
#
# tsumekae は npm にまだ存在せず、npm はパッケージが無いと Trusted Publisher
# を設定できない（設定画面がパッケージの下にしかない / npm/cli#8544）。
# stage は既存パッケージ専用なので、OIDC でも stage でも新しい名前を作れない。
#
# **公開したら必ず戻すこと。**
#
#   git revert <このコミット>
#
# 手順は docs/TOOLCHAIN.md「初回公開の手順」。
# ============================================================================
#
# `tsumekae-v*` タグを打つと npm に置く（公開はしない）。
#
# **kisekae とワークフローを分ける。** npm の Trusted Publishing は
# owner / repository / **workflow filename** の 3 つに紐づき、
# 接続は作ったあと編集できない（削除して作り直すしかない）。
# 1 つのワークフローで両方を publish すると、片方の接続を触るために
# もう片方も貼り直すことになる。
#
# **手元から publish しない。** この環境の `~/.npmrc` は既定レジストリが
# 社内プロキシを向いており、`pnpm publish` は `--dry-run` を付けても
# 出力ゼロのまま固まる（docs/TOOLCHAIN.md「この環境で `pnpm publish` を
# 手元から実行しない」）。CI から公開すれば、その事故が構造的に起きない。
on:
  push:
    tags: ["tsumekae-v*"]

permissions:
  contents: read
  id-token: write # provenance の署名に要る

# 同じタグを押し直したときに publish が二重に走らないようにする
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # **一時変更（初回公開のみ）。** 普段は `./.github/actions/setup` を使う。
      # ここで展開しているのは、`registry-url` を足す必要があるのに、
      # あの composite は 4 つのワークフローで共有していて
      # kisekae 側にも効いてしまうため。
      #
      # `registry-url` は setup-node に .npmrc へ
      # `_authToken=${NODE_AUTH_TOKEN}` を書かせる。トークン経路で publish
      # するにはこれが要る。**OIDC に戻したら必ず消すこと。**
      # 残っていると、OIDC が失敗したときにそのプレースホルダで publish して
      # 401 になり、本当の失敗理由が隠れる。
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile

      - name: タグと package.json の version が一致するか
        uses: ./.github/actions/check-tag-version
        with:
          package: tsumekae
          prefix: tsumekae-v

      # **ここでステップを並べない。** 理由は check.yml と同じで、
      # 定義は package.json の check ひとつに置く。
      # pack:check が「利用者の立場で読めるか」まで確かめるので、
      # 公開前の検査としてこれ以上足すものがない
      - name: すべての検査
        run: pnpm run check

      # prepublishOnly が build を走らせる（check の pack:check でも走っているが、
      # 出荷される dist はこちらが作ったものになる）
      #
      # **一時変更（初回公開のみ）。本来は `pnpm stage publish`。**
      # stage は Trusted Publishing の機能で、既存パッケージにしか使えない。
      # tsumekae はまだ存在しないので、初回だけトークンで直接 publish する。
      #
      # **初回だけ即時公開になる。** stage を通れないので、人間が 2FA で
      # 承認する関門が無いまま出る。一度きりの例外として受け入れる。
      #
      # トークンは granular access token で、
      # **`Bypass two-factor authentication` にチェックが要る**。
      # 入れないと CI に対話の 2FA が無くて direct publish が落ち、
      # `403 E_STAGE_REQUIRED` になる（kisekae 0.1.0 の 1 回目がこれ）。
      # `tsumekae` はまだ存在しないので `Only select packages` では選べず、
      # `All packages` が要る。
      #
      # --no-git-checks: タグの checkout は detached HEAD なので、
      #   pnpm の「publish ブランチにいるか」の確認が必ず落ちる
      # --provenance: トークン経路でも効くので初回から署名が付く
      #   （package.json の repository.url が実リポジトリと一致しているのが条件）
      - name: npm に公開する（初回のみ・即時公開）
        working-directory: packages/tsumekae
        run: pnpm publish --provenance --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: 次にやることの案内
        run: |
          echo "::notice::tsumekae@${GITHUB_REF_NAME#tsumekae-v} を公開した"
          echo "::notice::1) npmjs.com で Trusted Publisher を作る（cy-takeuchi/jissoku / release-tsumekae.yml / Allowed actions は未チェック）"
          echo "::notice::2) このコミットを git revert 3) NPM_TOKEN を削除しトークンを revoke 4) npm deprecate monosashi"
