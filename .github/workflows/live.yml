name: Live verification

# 実 kintone から採取し、コミット済みの基準と差分が出たら
# フィクスチャ更新 PR を立てる。
#
# PR では実 kintone に接続しない（Check ワークフロー）。
# PR ごとにライブ実行すると遅く不安定になり、やがて無効化されるため。
# 責務を分けることで、PR は速いまま、実物との乖離は最大 1 週間で検出できる。
#
# 【注意】スケジュール実行は、リポジトリが 60 日間非アクティブだと
# GitHub に自動で無効化される。「人が忘れても動く」ことが目的の仕組みなので、
# 止まっていないかを時々確認すること（Actions タブに警告が出る）。
on:
  schedule:
    - cron: "0 0 * * 1" # 毎週月曜 09:00 JST
  workflow_dispatch:

permissions:
  contents: write # フィクスチャ更新 PR のブランチを作る
  pull-requests: write

# 手動起動とスケジュールが重なると、同じ検証アプリに対して
# 採取が並行して走り、互いのレコードを見てしまう
concurrency:
  group: live-verification
  cancel-in-progress: false

jobs:
  # **1 つのジョブに両パッケージの採取を入れる。**
  # 同じ検証アプリを見るので、ジョブを分けると app:build や採取が並行して走り、
  # 「たまに落ちる不安定なジョブ」として現れる。concurrency は上で共有している。
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        # レコードの採取は monosashi のもの。kisekae の採取だけ
        # working-directory を上書きする
        working-directory: packages/monosashi
    env:
      KINTONE_BASE_URL: ${{ secrets.KINTONE_BASE_URL }}
      KINTONE_USERNAME: ${{ secrets.KINTONE_USERNAME }}
      KINTONE_PASSWORD: ${{ secrets.KINTONE_PASSWORD }}
      # アプリ ID は Secret ではなく Variable にする。
      # 秘密ではない（URL に出る）うえ、"1" や "2" のような短い値を Secret にすると
      # GitHub がログ中のあらゆる 1 と 2 を伏せてしまう。
      # 実際に "e2e" が "e***e"、"CB_NO02" が "CB_NO0***" になり、
      # 失敗の原因が読めなくなった。診断が仕事のジョブなので致命的。
      # 移行中でも動くよう、Variable が無ければ Secret を見る
      FIXTURE_APP_ID: ${{ vars.FIXTURE_APP_ID || secrets.FIXTURE_APP_ID }}
      FIXTURE_LOOKUP_APP_ID: ${{ vars.FIXTURE_LOOKUP_APP_ID || secrets.FIXTURE_LOOKUP_APP_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run e2e:install

      # 環境が壊れているのか kintone が変わったのかを区別する。
      # 先に前提を確かめておかないと、アプリを誰かが編集しただけでも
      # 「kintone が変わった」ように見える差分が出る
      - name: 検証アプリの構成チェック
        run: pnpm run app:verify

      # 適用（updateAppCustomize）は CI から行わない。
      # あれには **kintone のシステム管理権限**が要り、組織全体に効くため、
      # 「権限を検証アプリ 2 つに限定する」方針（Q9）が成立しなくなる。
      # しかも「アプリに任意の JS を仕込める」権限を CI に置くことになる。
      #
      # probe.js は変わらない限り貼り直す必要がない。
      # 適用は probe を変えたときに人がローカルから行い、ここでは
      # 貼られているものが手元のビルドと同一かを確認するだけにする。
      # 配信されている実物をダウンロードしてハッシュで比べるので、
      # サイズが同じで中身が違う場合も検出できる。
      #
      # 古い probe で採った結果を「kintone が変わった」と誤認するのが最悪なので、
      # 採取の前に必ず確かめる
      - name: 貼られている採取カスタマイズが最新か確認
        run: pnpm run probe:build && pnpm run app:check-probe

      - name: 実 kintone から採取
        run: pnpm run e2e

      - name: 正規化して基準を更新
        run: pnpm run fixture:build

      # フォーム定義の採取。**ブラウザを使わない**（REST の 2 API だけ）。
      # monosashi の採取のあとに直列で回す。同じアプリを見るため
      - name: フォーム定義を実 kintone から採取
        working-directory: packages/kisekae
        run: pnpm run app:collect-form

      - name: フォーム定義を正規化して基準を更新
        working-directory: packages/kisekae
        run: pnpm run fixture:form

      - name: 差分の有無を判定
        id: diff
        working-directory: .
        run: |
          if git diff --quiet -- packages/monosashi/fixtures/measured.json packages/kisekae/fixtures/form/definition.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "kintone は変わっていない"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "実測に差分が出た"
            git diff --stat -- packages/monosashi/fixtures packages/kisekae/fixtures
          fi

      # 新しい実測に対して既存のテストを走らせる。
      #
      # 本来は PR 上の Check ワークフローに判定させたいが、
      # **GITHUB_TOKEN で作った PR は on: pull_request を起動しない**（GitHub の仕様）。
      # PAT を増やすより、ここで判定して PR のタイトルに載せるほうが単純。
      #
      # continue-on-error にするのは、テストが落ちても PR は立てたいため。
      # 落ちたときこそ、新しい実測データが手元に必要になる。
      - name: 新しい実測に対して型の主張を検証
        id: verify
        if: steps.diff.outputs.changed == 'true'
        continue-on-error: true
        working-directory: .
        run: pnpm -r run test

      - name: フィクスチャ更新 PR を立てる
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          branch: fixture-update
          add-paths: |
            packages/monosashi/fixtures/measured.json
            packages/kisekae/fixtures/form/definition.json
          commit-message: "chore: 実測の変化を取り込む"
          title: >-
            ${{ steps.verify.outcome == 'failure'
              && '実測が変わり、型の主張が壊れた'
              || '実測が変わった（型の主張は保たれている）' }}
          body: |
            週次のライブ検証で `fixtures/measured.json` に差分が出た。

            **型の主張の検証結果: ${{ steps.verify.outcome == 'failure' && '❌ 失敗' || '✅ 成功' }}**

            - **失敗** → kintone の振る舞いが変わり、宣言している型が実物と合わなくなった。
              このジョブのログで `field.test.ts` / `coverage.test.ts` のどの主張が落ちたかを確認し、
              型を直してからマージする
            - **成功** → 形は変わっていない。値だけの変化（日時フォーマットなど）なので、
              diff を見て取り込むか判断する

            差分の読み方は `docs/DECISIONS.md` の「採取結果は決定的である」を参照。

      # 型の主張が壊れたことは通知が飛ぶべき事象なので、PR を立てたうえで落とす。
      # スケジュール実行の失敗は、ワークフローを最後に更新した人に通知される
      - name: 型の主張が壊れていたら失敗させる
        if: steps.verify.outcome == 'failure'
        run: |
          echo "::error::実測が変わり、型の主張が壊れた。fixture-update ブランチの PR を確認すること"
          exit 1
